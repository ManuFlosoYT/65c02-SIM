MEMORY {
  ZP:     start = $0000, size = $0100, type = rw;
  APP:    start = $0200, size = $4600, fill = no, file = %O;
  DUMMY:  start = $0000, size = $00FF, file = "";
}

SEGMENTS {
  ZEROPAGE: load = ZP, type = zp;
  HEADER:   load = APP, type = ro;
  VECTORS:  load = APP, type = ro;
  KEYWORDS: load = APP, type = ro;
  ERROR:    load = APP, type = ro;
  CODE:     load = APP, type = ro;
  CHRGET:   load = APP, type = ro;
  INIT:     load = APP, type = ro;
  EXTRA:    load = APP, type = ro;
  DUMMY:    load = DUMMY;
}
